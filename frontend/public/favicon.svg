<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Kosha">
  <!--
    Kosha favicon — the Gmail/YouTube formula: one saturated tile, one oversized
    letterform, nothing else.

    Sizing notes, since this went through three rejected drafts to get here:
      - The glyph is a LETTER, not the hexagon mark. A pointy-top hexagon is
        0.866 as wide as it is tall, so inside a square tile it forfeits the
        four corners and a third of the width — capped at ~68% of the frame
        however it is scaled. That geometry is what made the earlier drafts read
        as small. A K has no such penalty: it fills 51% x 73% of the frame here.
      - The tile is DARK. A gold tile washes out against light browser chrome
        (which is where it was actually failing). Dark cuts a hard edge out of
        the tab strip and moves the gold onto the glyph, where the eye lands.

    So this file deliberately does NOT match components/BrandMark.vue, which
    keeps the three nested hexagons and the opened top-right edge. That detail
    is legible at 24px+ in app chrome and turns to mud in a tab. Same brand, two
    render budgets — do not "fix" one to match the other.

    The K is stroked rather than outlined so the weight is a single number to
    tune; round caps and joins keep it from looking brittle at 16px.

    On the weight specifically — 10.5, not the 8.5 it started at. Gold on dark
    optically thins out where the same stroke dark-on-gold looks fat, so the
    letter has to be drawn heavier than it reads in the editor. Rasterising to a
    real 16x16 and magnifying nearest-neighbour is the only way to judge this:
    8.5 left ragged diagonals and dead space around the glyph, 12 started to
    close up the counters. 10.5 is the point where it is as bold as it can get
    while the triangular gaps still survive one-bit rounding.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31536a" />
      <stop offset="1" stop-color="#161a1e" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)" />

  <!-- Brand initial. Round caps extend the drawn coords by 5.25 each way, which
       lands the inked glyph at x 14.75-49.25, y 7.75-56.25 — centred on 32,32
       and covering 54% x 76% of the frame. -->
  <g stroke="#f0aa3a" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20 13V51" />
    <path d="M44 13L23 32L44 51" />
  </g>
</svg>
